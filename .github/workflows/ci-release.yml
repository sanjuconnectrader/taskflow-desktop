name: Validate and release desktop
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*.*.*']
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: windows-latest
    environment: production
    permissions:
      contents: write
    env:
      NEXT_PUBLIC_API_URL: ${{ vars.API_PUBLIC_URL || 'https://taskflow-backend-ouuj.onrender.com' }}
      FRONTEND_REF: ${{ vars.FRONTEND_REF }}
    steps:
      - name: Require configured production approval protection
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rules=$(gh api "repos/$GITHUB_REPOSITORY/environments/production" --jq '[.protection_rules[] | select(.type == "required_reviewers")] | length')
          test "$rules" -gt 0 || { echo "Configure required reviewers on the production environment before production releases."; exit 1; }
      - uses: actions/checkout@v4
      - name: Validate release inputs
        run: node -e "if(process.env.GITHUB_REF_NAME!=='v'+require('./package.json').version)throw Error('Version mismatch');if(!/^[a-f0-9]{40}$/.test(process.env.FRONTEND_REF||''))throw Error('Pin FRONTEND_REF to a reviewed commit SHA');if(!process.env.NEXT_PUBLIC_API_URL?.startsWith('https://'))throw Error('HTTPS API required')"
      - uses: actions/checkout@v4
        with:
          repository: sanjuconnectrader/taskflow-web
          ref: ${{ vars.FRONTEND_REF }}
          path: frontend-source
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend-source/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: frontend-source
      - run: npm test
        working-directory: frontend-source
      - run: npm run build
        working-directory: frontend-source
      - run: npm run assets
        env:
          FRONTEND_OUT: frontend-source/out
          NEXT_PUBLIC_API_URL: ${{ vars.API_PUBLIC_URL || 'https://taskflow-backend-ouuj.onrender.com' }}
      - run: npm run test:smoke
      - run: npm run test:ui
      - name: Build installer and update metadata
        shell: pwsh
        run: |
          if (($env:CSC_LINK -or $env:CSC_KEY_PASSWORD -or $env:WINDOWS_PUBLISHER_NAME) -and -not ($env:CSC_LINK -and $env:CSC_KEY_PASSWORD -and $env:WINDOWS_PUBLISHER_NAME)) { throw 'Configure the certificate, password, and publisher name together.' }
          $args = @('--win','nsis','--publish','never','--config.publish.provider=generic',"--config.publish.url=$env:NEXT_PUBLIC_API_URL/api/v1/updates/desktop/assets")
          if ($env:WINDOWS_PUBLISHER_NAME) { $args += "--config.win.publisherName=$env:WINDOWS_PUBLISHER_NAME" }
          npx electron-builder @args
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
          WINDOWS_PUBLISHER_NAME: ${{ vars.WINDOWS_PUBLISHER_NAME }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            release/*.exe
            release/latest.yml
      - name: Publish installer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --generate-notes --title "TaskFlow $GITHUB_REF_NAME"
          gh release upload "$GITHUB_REF_NAME" release/*.exe release/latest.yml
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest

name: Validate and release desktop
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*.*.*']
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: windows-latest
    environment: production
    permissions:
      contents: write
    env:
      NEXT_PUBLIC_API_URL: ${{ vars.API_PUBLIC_URL }}
      FRONTEND_REF: ${{ vars.FRONTEND_REF }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate release inputs
        run: node -e "if(process.env.GITHUB_REF_NAME!=='v'+require('./package.json').version)throw Error('Version mismatch');if(!/^[a-f0-9]{40}$/.test(process.env.FRONTEND_REF||''))throw Error('Pin FRONTEND_REF to a reviewed commit SHA');if(!process.env.NEXT_PUBLIC_API_URL?.startsWith('https://'))throw Error('HTTPS API required')"
      - uses: actions/checkout@v4
        with:
          repository: sanjuconnectrader/taskflow-web
          ref: ${{ vars.FRONTEND_REF }}
          path: frontend-source
          token: ${{ secrets.FRONTEND_READ_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend-source/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: frontend-source
      - run: npm test
        working-directory: frontend-source
      - run: npm run build
        working-directory: frontend-source
      - run: npm run assets
        env:
          FRONTEND_OUT: frontend-source/out
      - run: npm run test:smoke
      - run: npm run test:ui
      - run: npm run build:win
        env:
          CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/*.exe
      - name: Publish installer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/*.exe --verify-tag --generate-notes --title "TaskFlow $GITHUB_REF_NAME"
